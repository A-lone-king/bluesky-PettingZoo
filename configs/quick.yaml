 # Quick training configuration for fast validation runs
 # Usage: python train.py --config configs/quick.yaml
 scenario:
   name: HorizontalCR
   num_aircraft: 2
   max_steps: 50
 
 training:
   algorithm: PPO
   timesteps: 50000
   seed: 42
   n_steps: 128
   batch_size: 64
   n_epochs: 4
   learning_rate: 0.0003
   num_envs: 1
   norm_reward: false
 
 checkpoint:
   save_dir: models
   save_interval: 10000
   max_checkpoints: 3
 
 logging:
   tensorboard: true
   tensorboard_log_dir: runs/quick
   csv_log: true
