[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bluesky-pettingzoo"
version = "0.1.0"
description = "Multi-agent RL environment for ATM based on BlueSky and PettingZoo"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["reinforcement-learning", "multi-agent", "air-traffic-management", "bluesky", "pettingzoo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pettingzoo>=1.24.0",
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
bluesky = ["bluesky-simulator>=1.0.7"]
full = ["bluesky-pettingzoo[bluesky]"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/bluesky_pettingzoo/bluesky/wrapper.py" = ["N803"]
"src/bluesky_pettingzoo/utils/geometry.py" = ["N806"]
"src/bluesky_pettingzoo/envs/scenarios/static_obstacle.py" = ["N806"]
"tests/**" = ["F841", "N802"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["bluesky", "bluesky.*", "pettingzoo", "pettingzoo.*", "yaml", "stable_baselines3", "stable_baselines3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow and not e2e' --cov=src/bluesky_pettingzoo --cov-report=term-missing --cov-fail-under=80 --basetemp=tests/.pytest-temp"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring BlueSky engine",
    "e2e: marks tests as end-to-end tests",
]
